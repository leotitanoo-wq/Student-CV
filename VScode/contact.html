<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CV - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Get in Touch</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="education.html">Education & Projects</a></li>
            <li><a href="skills.html">Skills & Experience</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Contact Form</h2>
            <form action="#" method="POST">
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Martin Mwenda">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="martinmwenda123@example.com">
                </div>

                <div class="form-group">
                    <label for="subject">Subject / Inquiry type:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="internship">Internship Opportunity</option>
                        <option value="project">Project Collaboration</option>
                        <option value="general">General Inquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Your message here..."></textarea>
                </div>

                <button type="submit" class="btn">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Location & Social Highlights</h2>
            <div class="hero-container">
                <img src="https://via.placeholder.com/100" alt="Map icon image">
                <p>Based in Meru / Embu, Kenya.<br>Available for remote or hybrid opportunities.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Martin Mwenda. All rights reserved.</p>
    </footer>
</body>
</html>
